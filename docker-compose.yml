services:

  frontend:
    build:
      context: ./TimeManagerWebInterface/web_interface
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./TimeManagerAPI
    ports:
      - "4000:4000"
    depends_on:
      - db
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT}
      PGHOST: db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: